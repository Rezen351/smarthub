; PlatformIO configuration for ESP32 Button Matrix Scanner
; Build & flash: pio run -t upload && pio device monitor --baud 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D SERIAL_BAUD=115200
    -D SCAN_INTERVAL_MS=5
    -D ROW_SETTLE_US=20
    -D DEBOUNCE_MS=5
