; ====================================================================
;  E-Tani Smart Hub - Weight Transmitter (Load Cell HX711)
;  PlatformIO project — ESP32-S3 only
;
;  Board:
;    - ESP32-S3 (dual-core Xtensa LX7, 240 MHz, native USB)
;
;  Framework : Arduino (espressif32 6.6.0 -> arduino-esp32 2.0.17)
;
;  Features
;    - HX711 load cell read on core 0
;    - WiFi: WPA2-PSK and WPA2-Enterprise (PEAP/MSCHAPv2)
;    - W5500 Ethernet (hardware SPI)
;    - OLED SSD1306 display (I2C)
;    - Captive portal (soft-AP + DNS) for setup & calibration
;    - Modbus TCP server (WiFi or Ethernet) with standardized register map
;    - Persistence of config / calibration / totals in NVS
; ====================================================================

[env:esp32s3]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_protocol = esptool

lib_deps =
    https://github.com/robtillaart/HX711.git
    https://github.com/emelianov/modbus-esp8266.git#4.1.0
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    jandrassy/EthernetENC@^2.0.5

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ESP32S3

[platformio]
default_envs = esp32s3

[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = 10.18.115.110
upload_flags =
    --timeout=60
