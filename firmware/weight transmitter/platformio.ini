; ====================================================================
;  E-Tani Smart Hub - Weight Transmitter (Load Cell HX711)
;  PlatformIO project
;
;  Boards:
;    - ESP32 DOIT DevKit V1 (ESP32-WROOM-32, dual-core 240 MHz)
;    - ESP32-S3 (referred to as "ESP32 v4", single-core Xtensa LX7,
;                240 MHz, native USB, compatible with this firmware)
;    - ESP32-C3-MINI (single-core RISC-V, WiFi only, compact form factor)
;    - ESP32-WROOM-32U (U.FL antenna variant, same as esp32dev)
;
;  Framework : Arduino (espressif32 6.6.0 -> arduino-esp32 2.0.17)
;
;  Features
;    - HX711 load cell read on core 0
;    - WiFi: WPA2-PSK and WPA2-Enterprise (PEAP/MSCHAPv2)
;    - Captive portal (soft-AP + DNS) for setup & calibration
;    - Modbus TCP server with standardized register map
;    - Persistence of config / calibration / totals in NVS
; ====================================================================

[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
upload_protocol = esptool

; --------------------------------------------------------------------
; Dependencies (pinned to stable, ESP32-compatible releases)
;   robtillaart/HX711      - non blocking HX711 driver
;   emelianov/modbus-esp8266#4.1.0 - Modbus TCP server (register write
;                            API in this tag uses addHreg()/Hreg())
; --------------------------------------------------------------------
lib_deps =
    https://github.com/robtillaart/HX711.git
    https://github.com/emelianov/modbus-esp8266.git#4.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3

; --------------------------------------------------------------------
; ESP32-S3 (ESP32 v4) environment
;   - Uses ESP-IDF v5.x based Arduino core
;   - Compatible with existing firmware code
;   - Select with: pio run -e esp32s3
;   - Note: GPIO 2/4 are valid on ESP32-S3 DevKitC-1
; --------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
upload_protocol = esptool

lib_deps =
    https://github.com/robtillaart/HX711.git
    https://github.com/emelianov/modbus-esp8266.git#4.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ESP32S3

; --------------------------------------------------------------------
; ESP32-C3-MINI (ESP32-C3 based mini board)
;   - RISC-V single-core, WiFi only, native USB on some variants
;   - Uses ESP-IDF v5.x based Arduino core
;   - Select with: pio run -e esp32-c3-mini
;   - Note: GPIO 2 and GPIO 4 are valid on ESP32-C3-DevKitM-1
; --------------------------------------------------------------------
[env:esp32-c3-mini]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
upload_protocol = esptool

lib_deps =
    https://github.com/robtillaart/HX711.git
    https://github.com/emelianov/modbus-esp8266.git#4.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ESP32C3

; --------------------------------------------------------------------
; ESP32-WROOM-32U (U.FL antenna variant)
;   - Same chip as ESP32-WROOM-32, just external antenna connector
;   - Fully compatible with esp32dev config
;   - Select with: pio run -e esp32-wroom-32u
; --------------------------------------------------------------------
[env:esp32-wroom-32u]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
upload_protocol = esptool

lib_deps =
    https://github.com/robtillaart/HX711.git
    https://github.com/emelianov/modbus-esp8266.git#4.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3

; --------------------------------------------------------------------
; Build all boards at once
;   pio run
;   pio run --target upload   (builds all, prompts for port)
; --------------------------------------------------------------------
[platformio]
default_envs = esp32dev, esp32s3, esp32-c3-mini, esp32-wroom-32u