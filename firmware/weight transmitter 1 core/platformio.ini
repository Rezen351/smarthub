; ====================================================================
;  E-Tani Smart Hub - Weight Transmitter (Single Core)
;  PlatformIO project
;
;  Single-core ESP32 layout:
;    - All tasks run in loop() without FreeRTOS task pinning
;    - Scale reading, filtering, calibration, web portal, DNS, Modbus
;      TCP all execute sequentially in loop()
;
;  Boards:
;    - ESP32 DOIT DevKit V1 (ESP32-WROOM-32)
;    - ESP32-S3 (single-core Xtensa LX7)
;    - ESP32-C3-MINI (single-core RISC-V)
;    - ESP32-WROOM-32U (U.FL antenna variant)
;
;  Framework : Arduino (espressif32 6.6.0 -> arduino-esp32 2.0.17)
;
;  Features
;    - HX711 load cell read
;    - WiFi: WPA2-PSK and WPA2-Enterprise (PEAP/MSCHAPv2)
;    - Captive portal (soft-AP + DNS) for setup & calibration
;    - Modbus TCP server with standardized register map
;    - Persistence of config / calibration / totals in NVS
; ====================================================================

[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_protocol = esptool

lib_deps =
    https://github.com/robtillaart/HX711.git
    https://github.com/emelianov/modbus-esp8266.git#4.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3

