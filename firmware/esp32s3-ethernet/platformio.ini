[env:esp32s3-ethernet]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
src_filter = +<esp32s3-ethernet/>
lib_deps = 
    knolleary/PubSubClient
    jandrassy/EthernetENC@^2.0.5
build_flags = 
    -DCORE_DEBUG_LEVEL=5

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_filter = +<esp32dev/>
lib_deps = 
    knolleary/PubSubClient
    jandrassy/EthernetENC@^2.0.5
build_flags = 
    -DCORE_DEBUG_LEVEL=5

[platformio]
default_envs = esp32s3-ethernet
