version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: enyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enyx123}
      POSTGRES_DB: ${POSTGRES_DB:-enyx_smart_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enyx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enyx-network

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: enyx-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "test", "-i", "healthcheck", "-C", "1", "-W", "2"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - enyx-network

  redis:
    image: redis:7-alpine
    container_name: enyx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enyx-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enyx-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-enyx}:${POSTGRES_PASSWORD:-enyx123}@postgres:5432/${POSTGRES_DB:-enyx_smart_hub}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - enyx-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: enyx-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@enyx.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - enyx-network

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_logs:
  redis_data:
  pgadmin_data:

networks:
  enyx-network:
    driver: bridge
