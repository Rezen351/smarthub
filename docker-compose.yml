services:
  postgres:
    image: postgres:17-alpine
    container_name: enyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enyx123}
      POSTGRES_DB: ${POSTGRES_DB:-enyx_smart_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enyx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enyx-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enyx-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enyx}:${POSTGRES_PASSWORD:-enyx123}@postgres:5432/${POSTGRES_DB:-enyx_smart_hub}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: 3000
      THERMAL_PRINTER_RECEPTION_IP: ${THERMAL_PRINTER_RECEPTION_IP:-}
      THERMAL_PRINTER_RECEPTION_PORT: ${THERMAL_PRINTER_RECEPTION_PORT:-9100}
      THERMAL_PRINTER_PACKAGING_IP: ${THERMAL_PRINTER_PACKAGING_IP:-}
      THERMAL_PRINTER_PACKAGING_PORT: ${THERMAL_PRINTER_PACKAGING_PORT:-9100}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      scale-simulator:
        condition: service_started
    networks:
      - enyx-network

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enyx-db-migrate
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enyx}:${POSTGRES_PASSWORD:-enyx123}@postgres:5432/${POSTGRES_DB:-enyx_smart_hub}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - enyx-network

  scale-simulator:
    build:
      context: ./scripts/simulators
      dockerfile: Dockerfile
    container_name: enyx-scale-simulator
    restart: unless-stopped
    ports:
      - "5020:5020"
      - "5021:5021"
      - "5022:5022"
      - "8088:8088"
    networks:
      - enyx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enyx-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - enyx-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: enyx-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@enyx.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - enyx-network

  # Cloudflare Tunnel for secure remote public ingress
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: enyx-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    networks:
      - enyx-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  enyx-network:
    driver: bridge
